<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Google Authentication Website</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background: linear-gradient(135deg, #0f766e 0%, #164e63 100%);
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes slideInDown {
      from {
        opacity: 0;
        transform: translateY(-30px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes popupBounce {
      0% {
        opacity: 0;
        transform: scale(0.7) translateY(-50px);
      }
      50% {
        transform: scale(1.05);
      }
      100% {
        opacity: 1;
        transform: scale(1) translateY(0);
      }
    }

    .popup-overlay {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0, 0, 0, 0.5);
      backdrop-filter: blur(5px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 100;
      opacity: 0;
      animation: fadeIn 0.3s ease-out forwards;
    }

    .popup-modal {
      background: white;
      padding: 50px 40px;
      border-radius: 25px;
      text-align: center;
      box-shadow: 0 25px 50px rgba(0, 0, 0, 0.3);
      max-width: 450px;
      width: 90%;
      animation: popupBounce 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
      border-top: 5px solid #ff6b35;
    }

    .popup-modal h2 {
      color: #0f766e;
      font-size: 32px;
      margin-bottom: 15px;
    }

    .popup-modal p {
      color: #6b7280;
      font-size: 16px;
      line-height: 1.6;
      margin-bottom: 30px;
    }

    .popup-close-btn {
      background: linear-gradient(135deg, #0f766e 0%, #0d9488 100%);
      color: white;
      padding: 14px 40px;
      border: none;
      border-radius: 12px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
      box-shadow: 0 10px 20px rgba(15, 118, 110, 0.3);
    }

    .popup-close-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 15px 30px rgba(15, 118, 110, 0.4);
    }

    .hidden {
      display: none !important;
    }

    .welcome-overlay {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0, 0, 0, 0.3);
      backdrop-filter: blur(4px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 10;
    }

    .container {
      background: white;
      width: 420px;
      padding: 50px 40px;
      border-radius: 20px;
      text-align: center;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
      animation: fadeIn 0.8s ease-out;
      backdrop-filter: blur(10px);
    }

    .welcome-badge {
      display: inline-block;
      background: linear-gradient(135deg, #0f766e 0%, #0d9488 100%);
      color: white;
      padding: 8px 20px;
      border-radius: 30px;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 1px;
      margin-bottom: 20px;
      animation: slideInDown 0.6s ease-out;
    }

    h1 {
      margin-bottom: 15px;
      color: #1f2937;
      font-size: 36px;
      font-weight: 700;
      background: linear-gradient(135deg, #0f766e 0%, #ff6b35 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      animation: slideInDown 0.8s ease-out;
    }

    .welcome-message {
      color: #6b7280;
      margin-bottom: 30px;
      font-size: 16px;
      line-height: 1.6;
      animation: fadeIn 1s ease-out 0.2s both;
    }

    p {
      color: #9ca3af;
      margin-bottom: 10px;
      font-size: 14px;
    }

    button {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 12px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      letter-spacing: 0.5px;
    }

    .login-btn {
      background: white;
      color: #3c4043;
      border: 1px solid #dadce0;
      animation: fadeIn 1.2s ease-out 0.4s both;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      font-weight: 500;
    }

    .login-btn:hover {
      background-color: #f8f9fa;
      border-color: #d2d3d4;
      box-shadow: 0 2px 12px rgba(0, 0, 0, 0.15);
    }

    .login-btn:active {
      background-color: #f1f3f4;
    }

    .google-logo {
      width: 18px;
      height: 18px;
    }

    .logout-btn {
      background: #ff6b35;
      color: white;
      margin-top: 20px;
      box-shadow: 0 10px 20px rgba(255, 107, 53, 0.2);
    }

    .logout-btn:hover {
      background: #ff5520;
      transform: translateY(-2px);
      box-shadow: 0 15px 30px rgba(255, 107, 53, 0.3);
    }

    img {
      width: 100px;
      height: 100px;
      border-radius: 50%;
      margin-bottom: 20px;
      border: 4px solid #0f766e;
      animation: fadeIn 0.6s ease-out;
      box-shadow: 0 10px 30px rgba(15, 118, 110, 0.3);
    }

    #userSection h2 {
      color: #1f2937;
      font-size: 24px;
      margin-bottom: 8px;
      animation: fadeIn 0.8s ease-out;
    }

    #userSection p {
      color: #0f766e;
      margin-bottom: 25px;
      animation: fadeIn 1s ease-out;
    }

    .error {
      background: linear-gradient(135deg, #fee2e2 0%, #fecaca 100%);
      color: #991b1b;
      padding: 14px;
      border-radius: 12px;
      margin-bottom: 20px;
      font-size: 14px;
      border-left: 4px solid #ef4444;
      animation: slideInDown 0.4s ease-out;
      font-weight: 500;
    }

    #loginSection {
      animation: fadeIn 1s ease-out 0.4s both;
    }

    #userSection {
      animation: fadeIn 0.6s ease-out;
    }
  </style>
</head>
<body>

  <!-- Welcome Popup -->
  <div id="popupOverlay" class="popup-overlay">
    <div class="popup-modal">
      <h2>👋 Welcome!</h2>
      <p>Discover our exclusive collection of premium furniture. Join us today and enjoy a seamless shopping experience with special offers just for you!</p>
      <button class="popup-close-btn" onclick="closePopup()">Get Started</button>
    </div>
  </div>

  <div class="container">
    <div class="welcome-badge">✨ GN FURNITURE</div>
    <h1>Welcome!</h1>
    <p class="welcome-message">Your gateway to premium furniture solutions. Sign in to explore our exclusive collection and services.</p>

    <div id="errorBox" class="error hidden"></div>

    <div id="loginSection">
      <button class="login-btn" onclick="googleLogin()">
        <svg class="google-logo" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
          <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
          <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
          <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
          <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
        </svg>
        Sign in with Google
      </button>
    </div>

    <div id="userSection" class="hidden">
      <img id="userPhoto" src="" alt="User Photo">
      <h2 id="userName"></h2>
      <p id="userEmail"></p>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

   import {
  getAuth,
  GoogleAuthProvider,
  signInWithPopup,
  signOut,
  onAuthStateChanged,
  setPersistence,
  browserSessionPersistence
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

// Your web app's Firebase configuration
const firebaseConfig = {
  apiKey: "AIzaSyAultZZCva3grVSoAijNInStBbbv4HQtlU",
  authDomain: "gn-furniture.firebaseapp.com",
  projectId: "gn-furniture",
  storageBucket: "gn-furniture.firebasestorage.app",
  messagingSenderId: "828032714868",
  appId: "1:828032714868:web:e8dfbfc866a8548bed6921"
};
    // Initialize Firebase
    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
   const provider = new GoogleAuthProvider();

// Always ask user to choose account
provider.setCustomParameters({
  prompt: "select_account"
});

    const loginSection = document.getElementById("loginSection");
    const userSection = document.getElementById("userSection");
    const userPhoto = document.getElementById("userPhoto");
    const userName = document.getElementById("userName");
    const userEmail = document.getElementById("userEmail");
    const errorBox = document.getElementById("errorBox");
    const popupOverlay = document.getElementById("popupOverlay");

    window.closePopup = function() {
      popupOverlay.classList.add("hidden");
    }

    function showError(message) {
      errorBox.textContent = message;
      errorBox.classList.remove("hidden");
    }

    function hideError() {
      errorBox.classList.add("hidden");
    }

    // Google Login
    window.googleLogin = async function () {
  hideError();

  try {

    // Force account chooser
    provider.setCustomParameters({
      prompt: "select_account"
    });

    // Session only until browser closes
    await setPersistence(auth, browserSessionPersistence);

    // Google Login
    await signInWithPopup(auth, provider);

    // Redirect after login
    window.location.href = "home.html";

  } catch (error) {
    console.error(error);
    showError(error.message);
  }
};

    // Logout Function
    window.logout = async function () {
      hideError();

      try {
        await signOut(auth);
        alert("Signed out successfully");
      } catch (error) {
        console.error(error);
        showError("Sign out failed");
      }
    };

    // Check User State
    onAuthStateChanged(auth, (user) => {
      if (user) {
        loginSection.classList.add("hidden");
        userSection.classList.remove("hidden");

        userPhoto.src = user.photoURL;
        userName.textContent = user.displayName;
        userEmail.textContent = user.email;
      } else {
        loginSection.classList.remove("hidden");
        userSection.classList.add("hidden");
      }
    });
  </script>

</body>
</html>
