<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Google Authentication Website</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      background: #f3f4f6;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .container {
      background: white;
      width: 350px;
      padding: 30px;
      border-radius: 15px;
      text-align: center;
      box-shadow: 0 5px 20px rgba(0,0,0,0.1);
    }

    h1 {
      margin-bottom: 10px;
      color: #111827;
    }

    p {
      color: #6b7280;
      margin-bottom: 20px;
    }

    button {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 10px;
      font-size: 16px;
      cursor: pointer;
      transition: 0.3s;
    }

    .login-btn {
      background: #2563eb;
      color: white;
    }

    .login-btn:hover {
      background: #1d4ed8;
    }

    .logout-btn {
      background: #ef4444;
      color: white;
      margin-top: 20px;
    }

    .logout-btn:hover {
      background: #dc2626;
    }

    img {
      width: 90px;
      height: 90px;
      border-radius: 50%;
      margin-bottom: 15px;
    }

    .hidden {
      display: none;
    }

    .error {
      background: #fee2e2;
      color: #b91c1c;
      padding: 10px;
      border-radius: 8px;
      margin-bottom: 15px;
      font-size: 14px;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>Login Here!</h1>
    <p>Welcome to our Site please login here for our Services</p>

    <div id="errorBox" class="error hidden"></div>

    <div id="loginSection">
      <button class="login-btn" onclick="googleLogin()">
        Sign in with Google
      </button>
    </div>

    <div id="userSection" class="hidden">
      <img id="userPhoto" src="" alt="User Photo">
      <h2 id="userName"></h2>
      <p id="userEmail"></p>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

   import {
  getAuth,
  GoogleAuthProvider,
  signInWithPopup,
  signOut,
  onAuthStateChanged,
  setPersistence,
  browserSessionPersistence
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

// Your web app's Firebase configuration
const firebaseConfig = {
  apiKey: "AIzaSyAultZZCva3grVSoAijNInStBbbv4HQtlU",
  authDomain: "gn-furniture.firebaseapp.com",
  projectId: "gn-furniture",
  storageBucket: "gn-furniture.firebasestorage.app",
  messagingSenderId: "828032714868",
  appId: "1:828032714868:web:e8dfbfc866a8548bed6921"
};
    // Initialize Firebase
    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
   const provider = new GoogleAuthProvider();

// Always ask user to choose account
provider.setCustomParameters({
  prompt: "select_account"
});

    const loginSection = document.getElementById("loginSection");
    const userSection = document.getElementById("userSection");
    const userPhoto = document.getElementById("userPhoto");
    const userName = document.getElementById("userName");
    const userEmail = document.getElementById("userEmail");
    const errorBox = document.getElementById("errorBox");

    function showError(message) {
      errorBox.textContent = message;
      errorBox.classList.remove("hidden");
    }

    function hideError() {
      errorBox.classList.add("hidden");
    }

    // Google Login
    window.googleLogin = async function () {
  hideError();

  try {

    // Force account chooser
    provider.setCustomParameters({
      prompt: "select_account"
    });

    // Session only until browser closes
    await setPersistence(auth, browserSessionPersistence);

    // Google Login
    await signInWithPopup(auth, provider);

    // Redirect after login
    window.location.href = "home.html";

  } catch (error) {
    console.error(error);
    showError(error.message);
  }
};

    // Logout Function
    window.logout = async function () {
      hideError();

      try {
        await signOut(auth);
        alert("Signed out successfully");
      } catch (error) {
        console.error(error);
        showError("Sign out failed");
      }
    };

    // Check User State
    onAuthStateChanged(auth, (user) => {
      if (user) {
        loginSection.classList.add("hidden");
        userSection.classList.remove("hidden");

        userPhoto.src = user.photoURL;
        userName.textContent = user.displayName;
        userEmail.textContent = user.email;
      } else {
        loginSection.classList.remove("hidden");
        userSection.classList.add("hidden");
      }
    });
  </script>

</body>
</html>
