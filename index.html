<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GN Furniture - Welcome</title>
  <link rel="stylesheet" href="../css/style.css" />
</head>
<style>
  .popup-overlay {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background-color: rgba(0, 0, 0, 0.5);
    display: flex;
    justify-content: center;
    align-items: center;
    z-index: 1000;
  }

  .popup-modal {
    background-color: #fff;
    padding: 30px;
    border-radius: 10px;
    text-align: center;
    max-width: 400px;
    box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
  }

  .popup-close-btn {
    margin-top: 20px;
    padding: 10px 20px;
    background-color: #4f4e4e;
    color: #fff;
    border: none;
    border-radius: 5px;
    cursor: pointer;
    font-size: 16px;
  }

  .popup-close-btn:hover {
    background-color: #e8dfdf;
  }
  .container {
    max-width: 600px;
    margin: 100px auto;
    padding: 20px;
    background:rgb(223, 218, 218);
    border-radius: 10px;
    text-align: center;
    box-shadow: 1px 1px 1px 1px rgb(174, 173, 173);
  }
  .welcome-badge {
    display: inline-block;
    background-color: #4f4e4e;
    color: #fff;
    padding: 5px 15px;
    border-radius: 20px;
    font-size: 14px;
    margin-bottom: 20px;
  }
  .welcome-message {
    font-size: 18px;
    color: #101010;
    margin-top: 20px;
  }
  .login-btn {
    margin-top: 30px;
    padding: 10px 20px;
    background-color: #4f4e4e;
    color: #fff;
    border: none;
    border-radius: 5px;
    cursor: pointer;
    font-size: 16px;
    align-items: center;
    justify-content: center;
  }
  .login-btn:hover {
    background-color: #383a3d;
  }
  .google-logo {
    width: 20px;
    height: 20px;
    margin-right: 10px;
  }
</style>
<script type="module" src="../js/script-index.js"></script>
<body>
  <!-- Welcome Popup -->
  <div id="popupOverlay" class="popup-overlay">
    <div class="popup-modal">
      <h2>👋 Welcome!</h2>
      <p>Discover our exclusive collection of premium furniture. Join us today and enjoy a seamless shopping experience with special offers just for you!</p>
      <button class="popup-close-btn" onclick="closePopup()">Get Started</button>
    </div>
  </div>

  <div class="container">
    <div class="welcome-badge">✨ GN FURNITURE</div>
    <h1>Welcome!</h1>
    <p class="welcome-message">Your gateway to premium furniture solutions. Sign in to explore our exclusive collection and services.</p>

    <div id="errorBox" class="error hidden"></div>

    <div id="loginSection">
      <button class="login-btn" onclick="googleLogin()">
        <svg class="google-logo" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
          <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
          <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
          <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
          <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
        </svg>
        Sign in with Google
      </button>
    </div>

  <script type="module" src="js/script-index.js"></script>
</body>

</html>
